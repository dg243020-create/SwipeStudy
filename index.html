<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1033">
  <title>スワイプ単語帳 RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div class="hud-row">
      <div class="player">
        <span id="level">Lv.1</span>
        <div class="bar xp"><div id="xpFill" class="fill"></div></div>
      </div>
      <div id="today">今日 0/3体</div>
    </div>
    <div class="hud-row enemy">
      <span id="enemyEmoji" class="enemy-emoji">👾</span>
      <div class="enemy-info">
        <div class="enemy-name" id="enemyName">スライム語</div>
        <div class="bar hp"><div id="hpFill" class="fill"></div></div>
      </div>
      <div id="combo" class="combo">COMBO 0</div>
    </div>
  </header>

  <main id="feed" class="swipe-container" aria-live="polite"></main>

  <div id="fx" aria-hidden="true"></div>
  <div id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
